name: Laravel CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: klinik
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, pdo_pgsql, pgsql, openssl, intl, dom, fileinfo
        coverage: none

    - name: Validate composer.json
      run: composer validate --strict

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Composer Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Code style check (Pint)
      run: vendor/bin/pint --test

    - name: Prepare Database Schema, Migrations & Seeders
      env:
        DB_CONNECTION: pgsql
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        DB_DATABASE: klinik
        DB_USERNAME: postgres
        DB_PASSWORD: secret
        DB_SSLMODE: disable
      run: |
        php -r '$pdo = new PDO("pgsql:host=127.0.0.1;port=5432;dbname=klinik", "postgres", "secret"); $pdo->exec("CREATE SCHEMA IF NOT EXISTS klinik;");'
        php artisan migrate --force
        php artisan db:seed --force

    - name: Run PHPUnit Tests
      env:
        DB_CONNECTION: pgsql
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        DB_DATABASE: klinik
        DB_USERNAME: postgres
        DB_PASSWORD: secret
        DB_SSLMODE: disable
      run: php artisan test
