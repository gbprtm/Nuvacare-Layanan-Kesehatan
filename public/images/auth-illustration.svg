<svg xmlns="http://www.w3.org/2000/svg" width="320" height="260" viewBox="0 0 320 260" fill="none">
  <!-- Background Cloud/Bubble -->
  <path d="M72 130C60 114 62 86 82 72C102 58 130 64 142 80C158 56 194 54 214 74C234 94 232 124 218 142C236 156 238 186 218 202C198 218 168 212 152 196C138 216 104 220 84 200C64 180 68 148 72 130Z" fill="#DCE7FC"/>
  
  <!-- Clinic Dashboard / Card Window -->
  <g filter="drop-shadow(0px 8px 16px rgba(17, 20, 24, 0.08))">
    <rect x="50" y="36" width="220" height="150" rx="16" fill="#FFFFFF" stroke="#111418" stroke-width="2.5"/>
    <path d="M50 72H270" stroke="#111418" stroke-width="2.5"/>
    <circle cx="72" cy="54" r="5" fill="#111418"/>
    <circle cx="88" cy="54" r="5" fill="#7A8494"/>
    <circle cx="104" cy="54" r="5" fill="#E3E7EE"/>
  </g>

  <!-- Doctor / Medical Service Avatar inside Card -->
  <g transform="translate(68, 86)">
    <rect x="0" y="0" width="76" height="82" rx="12" fill="#E6EEFF" stroke="#1D4ED8" stroke-width="2"/>
    <!-- Medical Cross Badge -->
    <path d="M38 22V60M19 41H57" stroke="#1D4ED8" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Content Lines inside Card -->
  <g transform="translate(160, 92)">
    <rect x="0" y="0" width="94" height="12" rx="6" fill="#111418"/>
    <rect x="0" y="20" width="72" height="9" rx="4.5" fill="#7A8494"/>
    <!-- Verified WhatsApp pill -->
    <rect x="0" y="42" width="86" height="26" rx="13" fill="#E7F6EC" stroke="#14532D" stroke-width="1.8"/>
    <path d="M16 55L23 62L36 49" stroke="#14532D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="44" y="52" width="28" height="6" rx="3" fill="#14532D"/>
  </g>

  <!-- Small floating patient profile avatar circle -->
  <g transform="translate(236, 150)">
    <circle cx="24" cy="24" r="24" fill="#FFFFFF" stroke="#111418" stroke-width="2.5"/>
    <circle cx="24" cy="18" r="9" fill="#2563EB"/>
    <path d="M10 38C10 32 16 29 24 29C32 29 38 32 38 38" fill="#2563EB"/>
  </g>

  <!-- Small floating notification bell badge -->
  <g transform="translate(36, 126)">
    <circle cx="20" cy="20" r="20" fill="#FFFFFF" stroke="#111418" stroke-width="2.5"/>
    <path d="M20 12C16.7 12 14 14.7 14 18V22L12 24V25H28V24L26 22V18C26 14.7 23.3 12 20 12Z" fill="#111418"/>
    <circle cx="20" cy="28" r="2" fill="#111418"/>
    <circle cx="26" cy="12" r="4.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>
</svg>

