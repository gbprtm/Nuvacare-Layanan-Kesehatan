<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#EEF1F6">
  <title>Atur Ulang Kata Sandi - Klinik Sehat</title>
  <link rel="stylesheet" href="/css/style.css" fetchpriority="high">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Plus+Jakarta+Sans:ital,wght@0,500..800;1,500..800&display=swap">
  <script src="/js/api.js" defer fetchpriority="high"></script>
  <script src="/js/auth.js" defer></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Langsung ke isi utama</a>

  <header class="site-header">
    <nav class="navbar" aria-label="Navigasi utama">
      <a href="/index.html" class="brand brand--with-icon" translate="no">
        <span class="brand-logo-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 4v16m-8-8h16"/>
          </svg>
        </span>
        <span class="brand-text">Nuvacare</span>
      </a>
      <a href="/login.html" class="btn btn-secondary btn-sm">Masuk</a>
    </nav>
  </header>

  <main id="main-content" class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Atur Kata Sandi Baru</h1>
        <p>Buat kata sandi baru untuk akunmu.</p>
      </div>

      <div id="resetAlert" class="alert" role="alert" aria-live="polite"></div>

      <form id="resetForm" novalidate>
        <input type="hidden" id="resetToken" name="token">

        <div class="form-group">
          <label class="form-label" for="resetEmail">Alamat Email</label>
          <input type="email" id="resetEmail" name="email" class="form-input" required autocomplete="email" spellcheck="false" placeholder="nama@email.com…">
        </div>

        <div class="form-group">
          <label class="form-label" for="newPassword">Kata Sandi Baru (Min. 8 karakter)</label>
          <input type="password" id="newPassword" name="password" class="form-input" required minlength="8" autocomplete="new-password" placeholder="Minimal 8 karakter…">
        </div>

        <div class="form-group">
          <label class="form-label" for="newPasswordConfirm">Konfirmasi Kata Sandi Baru</label>
          <input type="password" id="newPasswordConfirm" name="password_confirmation" class="form-input" required minlength="8" autocomplete="new-password" placeholder="Ketik ulang kata sandi baru…">
        </div>

        <button type="submit" id="resetSubmitBtn" class="btn btn-primary btn-block">Simpan Kata Sandi Baru</button>
      </form>

      <div class="mt-4 pt-4 text-sm text-center" style="border-top: 1px solid var(--color-line);">
        <p>Tautan kedaluwarsa? <a href="/lupa-password.html" style="font-weight: 600;">Kirim ulang tautan reset</a></p>
        <p class="mt-2"><a href="/login.html" class="text-muted">Kembali ke halaman Masuk</a></p>
      </div>
    </div>
  </main>
</body>
</html>
