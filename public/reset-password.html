<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atur Ulang Kata Sandi - Sistem Janji Temu Klinik Sehat</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Atur Kata Sandi Baru</h1>
        <p>Silakan buat kata sandi baru untuk akun Anda.</p>
      </div>

      <div id="resetAlert" class="alert"></div>

      <form id="resetForm">
        <input type="hidden" id="resetToken">

        <div class="form-group">
          <label class="form-label" for="resetEmail">Alamat Email</label>
          <input type="email" id="resetEmail" class="form-input" required autocomplete="email" placeholder="nama@email.com">
        </div>

        <div class="form-group">
          <label class="form-label" for="newPassword">Kata Sandi Baru (Min. 8 Karakter)</label>
          <input type="password" id="newPassword" class="form-input" required minlength="8" autocomplete="new-password" placeholder="••••••••">
        </div>

        <div class="form-group">
          <label class="form-label" for="newPasswordConfirm">Konfirmasi Kata Sandi Baru</label>
          <input type="password" id="newPasswordConfirm" class="form-input" required minlength="8" autocomplete="new-password" placeholder="••••••••">
        </div>

        <button type="submit" id="resetSubmitBtn" class="btn btn-primary btn-block">Simpan Kata Sandi Baru</button>
      </form>

      <div class="mt-4 pt-4 text-sm" style="border-top: 1px solid var(--color-border); text-align: center;">
        <p>Tautan kedaluwarsa? <a href="/lupa-password.html" style="font-weight: 600;">Kirim Ulang Tautan Reset</a></p>
        <p class="mt-2"><a href="/login.html" class="text-muted">← Kembali ke Halaman Masuk</a></p>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
