<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Kata Sandi - Sistem Janji Temu Klinik Sehat</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Lupa Kata Sandi</h1>
        <p>Masukkan alamat email Anda untuk menerima tautan pengaturan ulang kata sandi.</p>
      </div>

      <div id="forgotAlert" class="alert"></div>

      <form id="forgotForm">
        <div class="form-group">
          <label class="form-label" for="forgotEmail">Alamat Email Terdaftar</label>
          <input type="email" id="forgotEmail" class="form-input" required autocomplete="email" placeholder="nama@email.com">
        </div>

        <button type="submit" id="forgotSubmitBtn" class="btn btn-primary btn-block">Kirim Tautan Reset</button>
      </form>

      <div class="mt-4 pt-4 text-sm" style="border-top: 1px solid var(--color-border); text-align: center;">
        <p><a href="/login.html" style="font-weight: 600;">← Kembali ke Halaman Masuk</a></p>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
