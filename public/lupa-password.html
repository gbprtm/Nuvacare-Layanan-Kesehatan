<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#EEF1F6">
  <title>Lupa Kata Sandi - Klinik Sehat</title>
  <link rel="stylesheet" href="/css/style.css" fetchpriority="high">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Plus+Jakarta+Sans:ital,wght@0,500..800;1,500..800&display=swap">
  <script src="/js/api.js" defer fetchpriority="high"></script>
  <script src="/js/auth.js" defer></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Langsung ke isi utama</a>

  <header class="site-header">
    <nav class="navbar" aria-label="Navigasi utama">
      <a href="/index.html" class="brand" translate="no">
        <span class="brand-text">Nuvacare</span>
      </a>
      <a href="/login.html" class="btn btn-secondary btn-sm">Masuk</a>
    </nav>
  </header>

  <main id="main-content" class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Lupa Kata Sandi</h1>
        <p>Masukkan alamat email terdaftar untuk menerima tautan pengaturan ulang kata sandi.</p>
      </div>

      <div id="forgotAlert" class="alert" role="alert" aria-live="polite"></div>

      <form id="forgotForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="forgotEmail">Alamat Email Terdaftar</label>
          <input type="email" id="forgotEmail" name="email" class="form-input" required autocomplete="email" spellcheck="false" placeholder="nama@email.com…">
        </div>

        <button type="submit" id="forgotSubmitBtn" class="btn btn-primary btn-block">Kirim Tautan Reset</button>
      </form>

      <div class="mt-4 pt-4 text-sm text-center" style="border-top: 1px solid var(--color-line);">
        <p><a href="/login.html" style="font-weight: 600;">Kembali ke halaman Masuk</a></p>
      </div>
    </div>
  </main>
</body>
</html>
