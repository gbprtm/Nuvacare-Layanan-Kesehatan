<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - Sistem Janji Temu Klinik Sehat</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Klinik Sehat</h1>
        <p>Silakan masuk ke akun Anda</p>
      </div>

      <div id="loginAlert" class="alert alert-danger" role="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Alamat Email</label>
          <input type="email" id="email" class="form-input" required autocomplete="email" placeholder="nama@email.com">
        </div>

        <div class="form-group">
          <div class="flex-between">
            <label class="form-label" for="password">Kata Sandi</label>
            <a href="/lupa-password.html" class="text-sm" style="margin-bottom: 0.35rem;">Lupa kata sandi?</a>
          </div>
          <input type="password" id="password" class="form-input" required autocomplete="current-password" placeholder="••••••••">
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-block">Masuk</button>
      </form>

      <div class="mt-4 pt-4 text-sm text-center" style="border-top: 1px solid var(--color-border); text-align: center;">
        <p>Belum memiliki akun? <a href="/daftar.html" style="font-weight: 600;">Daftar Pasien Baru</a></p>
        <p class="mt-2"><a href="/index.html" class="text-muted">← Kembali ke Beranda</a></p>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
