<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#EEF1F6">
  <title>Riwayat Pemeriksaan - Klinik Sehat</title>
  <link rel="stylesheet" href="/css/style.css" fetchpriority="high">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Plus+Jakarta+Sans:ital,wght@0,500..800;1,500..800&display=swap">
  <script src="/js/api.js" defer fetchpriority="high"></script>
  <script src="/js/pasien.js" defer></script>
  <script type="speculationrules">
  {
    "prefetch": [{
      "where": { "href_matches": "/pasien/*.html" },
      "eagerness": "conservative"
    }]
  }
  </script>
</head>
<body>
  <a href="#main-content" class="skip-link">Langsung ke isi utama</a>

  <header class="site-header">
    <nav class="navbar" aria-label="Navigasi utama">
      <a href="/pasien/janji-temu.html" class="brand brand--with-icon" translate="no">
        <span class="brand-logo-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 4v16m-8-8h16"/>
          </svg>
        </span>
        <span class="brand-text">Nuvacare</span>
      </a>
      <ul class="nav-links">
        <li><a href="/pasien/janji-temu.html">Janji Temu</a></li>
        <li><a href="/pasien/riwayat.html" class="active" aria-current="page">Riwayat</a></li>
        <li><a href="/pasien/jadwal-kontrol.html">Jadwal Kontrol</a></li>
        <li><a href="/pasien/profil.html">Profil</a></li>
        <li class="nav-user">
          <span id="navUserName" class="nav-user-name"></span>
          <button type="button" id="logoutBtn" class="btn btn-secondary btn-sm">Keluar</button>
        </li>
      </ul>
    </nav>
  </header>

  <main id="main-content" class="container">
    <div class="mb-4">
      <h1 class="page-title">Riwayat Pemeriksaan</h1>
      <p class="text-sm text-muted">Daftar kunjunganmu yang sudah selesai diperiksa beserta catatan dari dokter.</p>
    </div>

    <section class="card" aria-label="Tabel riwayat pemeriksaan">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Poliklinik</th>
              <th>Dokter</th>
              <th>Keluhan</th>
              <th>Catatan Dokter</th>
            </tr>
          </thead>
          <tbody id="historyTableBody" aria-live="polite">
            <tr>
              <td colspan="5" class="text-muted text-center" style="padding: var(--space-6);">
                Memuat riwayat pemeriksaan…
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
