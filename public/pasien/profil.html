<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#EEF1F6">
  <title>Profil Pasien - Klinik Sehat</title>
  <link rel="stylesheet" href="/css/style.css" fetchpriority="high">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Plus+Jakarta+Sans:ital,wght@0,500..800;1,500..800&display=swap">
  <script src="/js/api.js" defer fetchpriority="high"></script>
  <script src="/js/pasien.js" defer></script>
  <script type="speculationrules">
  {
    "prefetch": [{
      "where": { "href_matches": "/pasien/*.html" },
      "eagerness": "conservative"
    }]
  }
  </script>
</head>
<body>
  <a href="#main-content" class="skip-link">Langsung ke isi utama</a>

  <header class="site-header">
    <nav class="navbar" aria-label="Navigasi utama">
      <a href="/pasien/janji-temu.html" class="brand brand--with-icon" translate="no">
        <span class="brand-logo-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 4v16m-8-8h16"/>
          </svg>
        </span>
        <span class="brand-text">Nuvacare</span>
      </a>
      <ul class="nav-links">
        <li><a href="/pasien/janji-temu.html">Janji Temu</a></li>
        <li><a href="/pasien/riwayat.html">Riwayat</a></li>
        <li><a href="/pasien/jadwal-kontrol.html">Jadwal Kontrol</a></li>
        <li><a href="/pasien/profil.html" class="active" aria-current="page">Profil</a></li>
        <li class="nav-user">
          <span id="navUserName" class="nav-user-name"></span>
          <button type="button" id="logoutBtn" class="btn btn-secondary btn-sm">Keluar</button>
        </li>
      </ul>
    </nav>
  </header>

  <main id="main-content" class="container">
    <div style="max-width: 600px; margin: 0 auto;">
      <div class="mb-4">
        <h1 class="page-title">Profil Pasien</h1>
        <p class="text-sm text-muted">Perbarui data kontak, tanggal lahir, alamat, atau kata sandi akunmu.</p>
      </div>

      <section class="card" aria-label="Formulir profil pasien">
        <div id="profileAlert" class="alert" role="status" aria-live="polite"></div>

        <form id="profileForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Alamat Email (Tidak dapat diubah)</label>
            <input type="email" id="email" name="email" class="form-input" disabled spellcheck="false">
          </div>

          <div class="form-group">
            <label class="form-label" for="name">Nama Lengkap</label>
            <input type="text" id="name" name="name" class="form-input" required autocomplete="name" placeholder="Nama lengkapmu…">
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label class="form-label" for="phone_number">Nomor Telepon / WhatsApp</label>
              <input type="tel" id="phone_number" name="phone_number" class="form-input" inputmode="tel" autocomplete="tel" placeholder="0812xxxxxxxx…">
            </div>

            <div class="form-group">
              <label class="form-label" for="birth_date">Tanggal Lahir</label>
              <input type="date" id="birth_date" name="birth_date" class="form-input" autocomplete="bday">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="address">Alamat Tempat Tinggal</label>
            <textarea id="address" name="address" class="form-textarea" autocomplete="street-address" placeholder="Alamat lengkap tempat tinggalmu…"></textarea>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label class="form-label" for="password">Kata Sandi Baru (Opsional)</label>
              <input type="password" id="password" name="password" class="form-input" autocomplete="new-password" placeholder="Kosongkan bila tidak diubah…">
            </div>

            <div class="form-group">
              <label class="form-label" for="password_confirmation">Ulangi Kata Sandi Baru</label>
              <input type="password" id="password_confirmation" name="password_confirmation" class="form-input" autocomplete="new-password" placeholder="Ketik ulang kata sandi baru…">
            </div>
          </div>

          <div class="mt-4">
            <button type="submit" class="btn btn-primary">Simpan profil</button>
          </div>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
