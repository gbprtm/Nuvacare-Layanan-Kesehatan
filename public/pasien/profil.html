<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Saya - Sistem Janji Temu Klinik</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="brand">
      <span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--color-accent);"></span>
      Klinik Sehat
    </div>
    <ul class="nav-links">
      <li><a href="/pasien/janji-temu.html">Janji Temu</a></li>
      <li><a href="/pasien/riwayat.html">Riwayat</a></li>
      <li><a href="/pasien/jadwal-kontrol.html">Jadwal Kontrol</a></li>
      <li><a href="/pasien/profil.html" class="active">Profil</a></li>
      <li><a href="#" id="logoutBtn" style="color:var(--color-danger);">Keluar</a></li>
    </ul>
  </nav>

  <main class="container">
    <div style="max-width: 600px; margin: 0 auto;">
      <div class="card">
        <h1 class="card-title">Profil Pasien</h1>
        <p class="text-sm text-muted mb-4">Perbarui informasi kontak dan alamat Anda untuk kelancaran pelayanan klinik.</p>

        <div id="profileAlert" class="alert"></div>

        <form id="profileForm">
          <div class="form-group">
            <label class="form-label" for="email">Alamat Email (Tidak dapat diubah)</label>
            <input type="email" id="email" class="form-input" disabled style="background-color: var(--color-bg); cursor: not-allowed;">
          </div>

          <div class="form-group">
            <label class="form-label" for="name">Nama Lengkap</label>
            <input type="text" id="name" class="form-input" required placeholder="Nama lengkap Anda">
          </div>

          <div class="form-group">
            <label class="form-label" for="phone_number">Nomor Telepon / WhatsApp</label>
            <input type="text" id="phone_number" class="form-input" placeholder="08xxxxxxxxxx">
          </div>

          <div class="form-group">
            <label class="form-label" for="birth_date">Tanggal Lahir</label>
            <input type="date" id="birth_date" class="form-input">
          </div>

          <div class="form-group">
            <label class="form-label" for="address">Alamat Tempat Tinggal</label>
            <textarea id="address" class="form-textarea" placeholder="Alamat lengkap tempat tinggal"></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Kata Sandi Baru (Kosongkan jika tidak diubah)</label>
            <input type="password" id="password" class="form-input" placeholder="Minimal 8 karakter">
          </div>

          <div class="form-group">
            <label class="form-label" for="password_confirmation">Konfirmasi Kata Sandi Baru</label>
            <input type="password" id="password_confirmation" class="form-input" placeholder="Ketik ulang kata sandi baru">
          </div>

          <div class="mt-4">
            <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/pasien.js"></script>
</body>
</html>
