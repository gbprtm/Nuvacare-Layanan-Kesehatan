<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Pasien Baru - Sistem Janji Temu Klinik Sehat</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="auth-wrapper" style="padding: 2.5rem 1rem;">
    <div class="auth-card" style="max-width: 520px;">
      <div class="auth-header">
        <h1>Daftar Pasien Baru</h1>
        <p>Lengkapi formulir untuk membuat akun layanan klinik</p>
      </div>

      <div id="registerAlert" class="alert"></div>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" for="regName">Nama Lengkap Pasien *</label>
          <input type="text" id="regName" class="form-input" required placeholder="Contoh: Budi Santoso">
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">Alamat Email Aktif *</label>
          <input type="email" id="regEmail" class="form-input" required autocomplete="email" placeholder="nama@email.com">
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label class="form-label" for="regPhone">Nomor WhatsApp / HP</label>
            <input type="text" id="regPhone" class="form-input" placeholder="08xxxxxxxxxx">
          </div>

          <div class="form-group">
            <label class="form-label" for="regBirthDate">Tanggal Lahir</label>
            <input type="date" id="regBirthDate" class="form-input">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regAddress">Alamat Domisili</label>
          <input type="text" id="regAddress" class="form-input" placeholder="Jl. Nama Jalan No. XX, Kota">
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label class="form-label" for="regPassword">Kata Sandi (Min. 8 karakter) *</label>
            <input type="password" id="regPassword" class="form-input" required minlength="8" autocomplete="new-password" placeholder="••••••••">
          </div>

          <div class="form-group">
            <label class="form-label" for="regPasswordConfirm">Konfirmasi Kata Sandi *</label>
            <input type="password" id="regPasswordConfirm" class="form-input" required minlength="8" autocomplete="new-password" placeholder="••••••••">
          </div>
        </div>

        <button type="submit" id="regSubmitBtn" class="btn btn-primary btn-block mt-2">Daftar Sekarang</button>
      </form>

      <div class="mt-4 pt-4 text-sm" style="border-top: 1px solid var(--color-border); text-align: center;">
        <p>Sudah memiliki akun? <a href="/login.html" style="font-weight: 600;">Masuk di sini</a></p>
        <p class="mt-2"><a href="/index.html" class="text-muted">← Kembali ke Beranda</a></p>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
